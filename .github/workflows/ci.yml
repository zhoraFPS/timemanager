name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Fail the job if lint, types, or tests fail. The Prisma client is
    # generated so type-check and tests can resolve `@prisma/client`.
    env:
      # Tests use inline mocks for db access; DATABASE_URL just needs to be
      # syntactically valid so `prisma generate` does not complain.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: "test-secret-long-enough-to-pass-32-char-check"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build
